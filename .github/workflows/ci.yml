# ============================================================================
# prompt-ids CI
#
# ⚠⚠ 关于「两条腿都绿」这件事，先说清楚，别让这个文件制造错觉：
#
#   * windows-latest —— **验证过**。682 项单测在本机 Windows / Python 3.11 全绿。
#   * ubuntu-latest  —— **未验证**。这条腿是新增的，本项目至今没在任何 Linux
#     机器上跑过单测。首次跑通之前，请不要把它当成「跨平台已验证」的证据。
#
#   本 workflow 的作用是把「验证过」变成「每次提交自动验证」，
#   而不是替一个未验证的平台背书。两个平台的差异（路径分隔符、代码页、
#   文件锁、时序精度）恰恰是最容易出静默失效的地方 ——
#   本仓库已经吃过一次亏：Windows 的 time.time() 只有 15.625ms 分辨率，
#   令 canary 轮换在同一个 tick 内静默失效。回归测试
#   `test_canary_current_is_newest_even_within_one_clock_tick` 钉住了这一条。
#
# ⚠ 这里**不跑**任何需要 API Key 或联网下数据集的脚本。
#   build_overrefusal.py / build_pint_shape.py / eval_semantic.py / agent_check.py
#   等一律不进 CI：它们要么下几十 MB 外部语料，要么对 LLM 端点发几百次请求，
#   既不可复现也不该在 PR 上花这个钱。CI 只跑**纯本地、确定性**的那部分。
# ============================================================================
name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只需要读代码。不给 contents: write。
permissions:
  contents: read

# 同一个分支的新提交取消上一次还在跑的 CI，避免队列堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 两边都要看到结果：一边失败就取消另一边，会把「哪个平台坏了」这个
    # 关键信息藏掉 —— 而跨平台差异正是这个 workflow 存在的理由。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            note: "已验证：本机 Windows / Python 3.11 上 682 项单测全绿。"
          - os: ubuntu-latest
            note: "未验证：本项目至今未在任何 Linux 机器上跑过单测，首次跑通前不要引用为跨平台结论。"

    steps:
      # ⚠ 必须用 v5/v6：v4/v5 跑在 Node.js 20 上，而 GitHub 已于 2025-09
      # 弃用该运行时并强制改到 Node 24（日志里那条 Node.js 20 is deprecated）。
      # 别降级 —— 官方随时会停掉 Node 20 目标的版本。
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 装 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # 只缓存 pip 下载，不缓存 site-packages —— 后者会把本机的
          # torch/regex 装法带进 CI，环境就不确定了。
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 装依赖（dev + speed）
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,speed]"
        # ⚠ 刻意**不装** semantic / memory 两个 extra：
        #   torch + transformers 约 2GB，装它会让每次 CI 多花几分钟且容易超时，
        #   而单测里 L3 的行为由替身覆盖（见 tests/test_regressions.py）。
        #   没装 transformers/torch 时 LocalModelBackend.is_available() 返回 False，
        #   这正是测试要断言的那种「静默降级」路径，所以缺依赖反而测到了真东西。

      - name: ruff 静态检查（闸门）
        run: python -m ruff check prompt_ids scripts tests --output-format=github
        # **真闸门**。基线债务已于 2026-10 清零：85 → 0
        # （42×F401 未用导入 · 18×E741 · 11×F841 · 6×E702 · 5×F541 · 3×F811）。
        #
        # 期间这一条**故意**挂过 continue-on-error，理由值得留着：
        # 85 条历史告警当闸门的话 CI 从第一天起就是红的 —— 那不是保护，是噪声，
        # 而噪声会训练人习惯性忽略红灯（比没有 CI 更糟）。
        #
        # 清零的方式（下次再加规则时照此办理）：
        #   F401 / F541 用 `--fix`（50 条，机械且安全）；
        #   E741 / E702 / F841 **逐处人工读上下文**后改 —— `l` 出现在元组解包
        #   （`for s, l, m in rows`）与推导式里，正则硬改极易改错位置或漏改，
        #   而「E741 变 0」与「代码还能跑」是两件事，必须都成立（每次改完跑全量 pytest）。
        #   期间真查出两个不是风格问题的：F811（core/pipeline.py 重复导入
        #   SemanticDetector）与 F841（proxy 直通路径算了 `text` 却没用 ——
        #   说明那条路径**没有把文本传给审计**，指纹与 chat 路径不同源）。
        #
        # ⚠ **规则集在 pyproject 的 [tool.ruff] 里，不靠 ruff 的默认值**。
        #   2026-10 踩过：当时没有那份配置，于是「本地 ruff 0 条 / CI 报 11 条」，
        #   根因是**默认规则集随 ruff 版本变化**（本地 0.15.13 不含 I/UP/DTZ/BLE/RUF，
        #   CI 上装到的较新版本含）。这类失败的恶劣之处：
        #     ① 看着像「CI 环境有问题」，实际是配置缺失；
        #     ② 下个 ruff 版本还会再红（本地无法提前发现）；
        #     ③ 本地永远复现不了 —— 而本项目的纪律就是「本地绿不等于对」。
        #   ⇒ 加规则时同步改 [tool.ruff] 的 select，让「本地 == CI」成为配置保证。
        #
        # 本轮（2026-10）清零的第二批：27×I001 · 21×UP037 · 10×UP035 ·
        # 66×RUF100（机械，`--fix`，改完全量 pytest 782 项全绿）
        # 与 28×BLE001 —— 后者**逐处人工读上下文**：全部是「可选依赖缺失 /
        # 后端加载失败 / 解码变体生成跳过 / 兜底清理」的有意降级路径，
        # 逐处加 `# noqa: BLE001` 并写清「为什么必须捕获全部」。
        # 刻意不一律 noqa：加 noqa 让 lint 变绿与「这个捕获是对的」是两件事，
        # 本项目基线清零时 F841 真查出过 bug（proxy 直通路径没把文本传给审计）。
        #
        # 只查 prompt_ids scripts tests，不查 data/：data/raw/ 是下载来的第三方语料，
        # 对它跑 lint 只会产出与本项目无关的噪声。

      - name: packaging 自检（package-data 有没有真的装进去）
        run: python -m prompt_ids.cli --rules-stats
        # 这条是**闸门**而不是装饰：prompt_ids/rules/*.yaml 是 package-data，
        # 一旦打包配置写错（比如漏了 package-data 或被 .dockerignore 排掉），
        # 规则层会变成「一条规则都没有」，而服务照常起、照常返回 200 ——
        # 静态检查发现不了这种故障，只有真跑一次规则加载能发现。

      - name: 单测
        run: python -m pytest
        # ⚠ 绝不在这里叠 -q：pyproject 的 addopts 已经有 "-q"，叠了会变 -qq，
        #   pytest 连 "N passed" 总结行一起吞掉，于是「全绿」和「一个都没跑」
        #   在输出里长得一模一样。判全绿看退出码（Actions 本来就看退出码）。
        #   数用例用 --collect-only -q。

      - name: 端到端冒烟
        run: python scripts/smoke.py
        # 期望「检出 10/10，误报 0/6」。纯本地，不联网、不需要 Key。

      - name: 看板自检（需要 node，允许失败）
        run: python scripts/check_dashboard.py
        continue-on-error: true
        # 用真 JS 引擎跑一遍看板里的内联脚本。允许失败的两个原因：
        #   1) 需要本机有 node（脚本内部按 shutil.which 找，找不到会优雅跳过，
        #      但「跳过」与「通过」在 Actions 里同为绿色，这里不假装两者一样）；
        #   2) 看板要读 reports/*.json，而 reports/ 不入库 ⇒ CI 上多数检查是 SKIP，
        #      本地有报告时才会真跑。允许失败是为了不挡住真正该挡的东西。

      - name: 规则层对抗输入耗时上界（允许失败）
        run: python scripts/redos_check.py
        continue-on-error: true
        # 纯计时，阈值与机器性能强相关（共享 runner 上噪声很大）。
        # 它防的是「远程可打 DoS」那一类回归，值得跑，但不该因为共享 runner
        # 慢 20ms 就把整个 PR 判死。

      - name: 记录验证状态（job summary）
        env:
          # 用 YAML 块标量传文本，避开 Windows(pwsh) 与 Linux(bash) 的引号差异。
          SUMMARY: |
            ### prompt-ids CI · ${{ matrix.os }}

            ${{ matrix.note }}

            - 单测：`python -m pytest`（pyproject 的 `addopts = "-q"` 已生效；
              **不要**在命令行再叠 `-q`，会变 `-qq` 并吞掉 "N passed" 总结行）
            - 装的是 `.[dev,speed]`，**不含** `semantic`/`memory`
              （torch + transformers 约 2GB；且没装它们时 `LocalModelBackend.is_available()`
              返回 False，正好让单测覆盖到「后端不可用 → 弃票」那条路径）
            - 闸门：`pytest`、`scripts/smoke.py`、`--rules-stats`
            - 非闸门：`ruff check`（基线债务 85 条，见 workflow 注释）、
              `scripts/check_dashboard.py`（需 node 且依赖未入库的 `reports/*.json`）、
              `scripts/redos_check.py`（计时，阈值与机器性能相关）
            - 刻意不跑：任何需要 API Key 或联网下载数据集的脚本
              （`build_overrefusal.py` / `build_pint_shape.py` / `eval_semantic.py` /
              `agent_check.py` …）—— 不可复现，且不该在 PR 上花这个钱。

            ⚠ 首次跑通前，本文件**不构成**「跨平台已验证」的结论。
        run: >-
          python -c "import os, pathlib;
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(os.environ['SUMMARY'],
          encoding='utf-8')"