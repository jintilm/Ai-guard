# 生产部署参考配置（prompt-ids 透明代理）
#
# 这份文件是**可执行的方案**，不是声明 —— `tests/test_deploy.py` 会逐条断言
# 下面被标 ⚠ 的项，缺任何一条测试就红。改它之前先看那份测试。
#
# 用法：
#   1. 容器/进程里起本服务：`prompt-ids-proxy --host 0.0.0.0 --port 8787 \
#          --client-key <你的客户端 Key>`
#   2. nginx 以本文件为 site 片段，`nginx -t` 后 reload
#   3. 客户端：`base_url=https://guard.example.com/v1` + `X-API-Key: <同一个 Key>`
#
# ⚠ 为什么服务要绑 0.0.0.0 而这里监听 127.0.0.1：
#   容器网络里，nginx 与服务在**不同网络命名空间**，服务绑 127.0.0.1 的话
#   nginx 根本连不上（127.0.0.1 是「本容器」）。所以服务必须对外，
#   而**唯一挡住外部访问的就是这一层**。
#   ⇒ 服务不开 `--client-key` 时，这一层就成了唯一的一道门 ——
#   那正是「不要省略 --client-key」这句话的原因。

upstream prompt_ids_guard {
    # 同机部署时用 127.0.0.1；compose 里改成 service 名（见 docker-compose.yml）
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP 只用于「先验证配置对不对」，正式环境请只保留 443
server {
    listen 80;
    server_name guard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name guard.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/guard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- 体积上限 ---
    # ⚠ 必须显式设。不设的话 nginx 默认 1MB，而本服务自己的上限是 2MB ——
    #   于是「服务允许的请求」会被网关在更小的尺寸上拒掉，而报错来自 nginx、
    #   不来自服务，排障时要跨两个组件才看得出是谁拒的。
    #   略大于服务的 2MB，让拒绝永远发生在服务侧（错误信息更清楚）。
    client_max_body_size 3m;

    # --- 超时 ---
    # ⚠ 必须**大于** LLM 调用的 p90。实测第三方网关 p90 ≈ 40s（p99 更长），
    #   nginx 默认 proxy_read_timeout 是 60s —— 不足以覆盖长尾。
    #   现象极其难查：间歇性 504，而**服务日志一切正常**（它还在等上游）。
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://prompt_ids_guard;
        proxy_http_version 1.1;

        # ⚠ 透传客户端真实 IP —— 本服务的按 IP 限流分桶靠这个头。
        #   缺了它，所有客户端在服务看来都是同一个 IP（nginx 的），
        #   于是**第一个客户端就把所有人的额度耗尽**，而这不是鉴权能解决的。
        #   注意 $proxy_add_x_forwarded_for 是追加，不是覆盖。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠ 透传客户端的 X-API-Key 到本服务 —— 不透传的话，
        #   `--client-key` 配了也会 401（客户端令牌在 nginx 这层被丢掉了）。
        proxy_set_header X-API-Key $http_x_api_key;

        # 上游凭据（PROMPT_IDS_UPSTREAM_KEY）**不**由客户端提供，
        # 由服务自己持有。所以这里不要把客户端的 Authorization 覆盖掉 ——
        # 透传它会让客户端的令牌与上游凭据混在一起（见 prompt_ids/auth.py）。
        proxy_set_header Host $host;

        # 流式响应（SSE）不能被缓冲：缓冲会让「逐帧告警」全部攒到最后才吐出来，
        # 而告警帧必须排在 [DONE] 之前才有意义。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # 监控/审计目录**不要**在这里暴露 —— 里面有指纹、判定与 pattern_id。
    # 应用方要读就让它自己调 `/v1/events`（带鉴权），而不是直接读文件。
}