[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-ids"
version = "0.1.0"
description = "提示词注入检测系统：归一化 → 解码展开 → L1 规则 / L2 启发 / L3 语义 → 加权融合决策"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prompt-ids contributors" }]
keywords = ["prompt injection", "LLM security", "guardrail", "提示词注入"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
    # ⚠ **numpy 是硬依赖，不是 [memory] extra**：memory/store.py 与 memory/encoder.py
    #   在**模块级** import numpy，而 core/pipeline.py 传递依赖它们 ⇒ 只装 PyYAML 时
    #   `import prompt_ids` 直接 ImportError，连纯规则层都起不来（实测确认）。
    #   这条曾经只写在 [memory] 里，于是「装完 PyYAML 就能跑」这句话是假的，
    #   而失败发生在 import 期、报错只说缺 numpy，看不出跟规则层有关。
    "numpy>=1.24",
]

[project.optional-dependencies]
# regex 要放进 dev：引擎等价性测试在没装它时会整体 skip，装了才真正跑到
dev = ["pytest>=7.0", "ruff>=0.4", "regex>=2023.0"]
# CPU 版 torch 建议用官方 CPU 源安装，体积比默认 CUDA 包小一个量级：
#   pip install --index-url https://download.pytorch.org/whl/cpu torch
semantic = ["transformers>=4.36", "torch>=2.1", "scikit-learn>=1.3", "joblib>=1.3"]
# 向量记忆库，可选；缺失时自动退回 numpy 暴力检索（numpy 本身已是硬依赖，见上）
memory = ["faiss-cpu>=1.7"]
# 规则层正则引擎。regex 对字面量前缀会先做一次快速定位再回溯，
# 实测中文长文本 4.8×、公开集 1.15×，且与 re 语法兼容、结果逐条一致。
# 不装则自动退回标准库 re，只是慢一些，不会少检。
speed = ["regex>=2023.0"]

[project.scripts]
prompt-ids = "prompt_ids.cli:main"
prompt-ids-proxy = "prompt_ids.proxy.__main__:main"
prompt-ids-api = "prompt_ids.api.__main__:main"

[tool.setuptools.packages.find]
include = ["prompt_ids*"]

[tool.setuptools.package-data]
prompt_ids = ["rules/*.yaml"]

[tool.ruff]
# ⚠ 本节是 2026-10 补的，根因是**之前完全没有 ruff 配置** ——
#   没配置就用「ruff 当前版本的默认规则集」，而默认集随版本变化：
#   本地 0.15.13 不含 I/UP/DTZ/BLE/RUF，CI 上较新版本含
#   ⇒ 表现为「本地 ruff 0 条、CI 报 11 条」，且下个 ruff 版本还会再红。
#   现在显式钉死，让「本地 == CI」成为配置保证而不是版本巧合。
#
#   加规则集的流程照此（别直接抄上面的清单）：
#     1. 写清每一条**为什么**要（不为了「全绿」而为了「某类缺陷看得见」）；
#     2. 先 `--select` 跑一遍看基线条数；
#     3. **逐条读上下文**改 —— 有意为之的（兜底 catch、带引号的注解）
#        加 `# noqa` 并写明理由，不要为了过 lint 删掉行为；
#     4. 跑全量 pytest 确认「lint 变绿」与「代码还对」同时成立；
#     5. 才写进这里。
#
#   基线（2026-10 清零）：85 → 0
#   （42×F401 · 18×E741 · 11×F841 · 6×E702 · 5×F541 · 3×F811）。
#   期间查出两个不是风格问题的：F811（core/pipeline.py 重复导入
#   SemanticDetector）与 F841（proxy 直通路径算了 text 却没用 ——
#   说明那条路径**没有把文本传给审计**，指纹与 chat 路径不同源）。
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 先保持 ruff 的默认集（E4,E7,E9,F）—— 显式写出是为了「不依赖默认」，
# 否则将来 ruff 改默认值又是一次「本地绿 CI 红」。
select = [
    "E4",    # pycodestyle：导入相关
    "E7",    # pycodestyle：语句
    "E9",    # pycodestyle：语法错误
    "F",     # pyflakes：未用名/未用导入/重复定义

    # 以下六条是 CI 实际报出来的那批，逐条理由见 [tool.ruff] 上方注释。
    "UP037", # 注解里的引号是多余的（需有 from __future__ import annotations）
    "UP035", # typing.Iterable/Sequence/Callable 已废弃 → collections.abc
    "I001",  # import 顺序：乱序的 import 会在合并冲突与自动修复时放大
    "DTZ006",# fromtimestamp() 不带 tz → naive/aware 混用会算错
    "BLE001",# 盲捕 Exception：**信号**，不是自动改 —— 有意的兜底要写 noqa
    "RUF100",# 多余的 noqa 会掩盖真实的抑制需求
]
# 有意保留的兜底 catch（server.py 的 HTTP 最外圈、app.py 的编码器不可用）
# 已逐处加 `# noqa: BLE001` 并写明理由。`required-noqa` 刻意**不开**：
# 开了之后每条机械问题都要写 noqa，反而噪音更大。

[tool.ruff.lint.per-file-ignores]
# 测试夹具里故意写凭据形态（密钥扫描器的合成素材）与故意用漏洞路径字符串，
# 改动它们等于删掉测试素材。
"tests/*" = ["S", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: 要起子进程/加载模型的守护（~1s 起）。用 -m 'not slow' 跳过。",
]
